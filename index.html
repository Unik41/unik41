{id:'a1',title:'Выходные у подножия вулкана',price:8500,city:'Елизово',cat:'Отдых',desc:'Демонстрационное объявление. Однодневный маршрут, горячий чай и невероятные виды. Цена за человека.',owner:'tour',featured:true,emoji:'🏔',photos:[]},

{id:'a4',title:'iPhone 13 · 128 ГБ',price:32000,city:'Вилючинск',cat:'Электроника',desc:'Демо: телефон в хорошем состоянии, комплект с коробкой.',owner:'ivan',emoji:'📱',photos:[]},

let state=structuredClone(seed),storageOK=true;try{const raw=localStorage.getItem('unik41-v3');if(raw){const s=JSON.parse(raw);if(s.version===3&&Array.isArray(s.ads)&&s.profile&&s.chats&&Array.isArray(s.reviews)&&Array.isArray(s.favorites))state=s;else throw Error();}localStorage.setItem('unik41-probe','1');localStorage.removeItem('unik41-probe')}catch(e){storageOK=false;}
let page='home',category='Все',query='',city='',min='',max='',sort='new',editing=null,draftPhotos=[],photoBusy=false,activeChat=null;
const price=n=>Number(n).toLocaleString('ru-RU')+' ₽',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),seller=id=>id==='me'?state.profile:sellers[id],options=(arr,val,empty='')=>(empty?`<option value="">${empty}</option>`:'')+arr.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('');
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',4000)}
function commit(next){try{localStorage.setItem('unik41-v3',JSON.stringify(next));state=next;storageOK=true;return true}catch(e){toast('Не удалось сохранить: хранилище недоступно или заполнено. Удалите лишние фото.');return false}}
function change(fn){const n=structuredClone(state);fn(n);return commit(n)}
function nav(p){page=p;$('#modal').close();render();window.scrollTo(0,0)}
function navigation(){const items=[['home','⌂','Главная'],['favorites','♡','Избранное'],['post','＋','Подать'],['chat','☏','Сообщения'],['profile','☺','Профиль']];$('.bottom').innerHTML=items.map(([p,i,t])=>`<button class="${page===p?'selected':''} ${p==='post'?'add':''}" data-nav="${p}" ${page===p?'aria-current="page"':''}><b>${i}</b>${t}</button>`).join('')}
function card(a){return `<article class="card ${a.featured?'featured':''}"><button class="heart" data-fav="${a.id}" aria-label="${state.favorites.includes(a.id)?'Убрать из избранного':'В избранное'}" aria-pressed="${state.favorites.includes(a.id)}">${state.favorites.includes(a.id)?'♥':'♡'}</button>${a.photos.length?`<img class="visual" src="${a.photos[0]}" alt="${esc(a.title)}">`:`<div class="visual" aria-hidden="true">${a.emoji||'📦'}</div>`}<div class="cardbody">${a.featured?'<span class="badge">ВЫБОР UNIK41 · ДЕМО</span><br>':''}<strong>${price(a.price)}</strong><button class="cardtitle" data-ad="${a.id}">${esc(a.title)}</button><div class="location">${esc(a.city)}<br>${esc(a.cat)}${a.owner==='me'?' · Моё объявление':''}</div></div></article>`}

function results(){const a=filtered();$('#results').innerHTML=`<div class="sectionhead"><h2>Объявления рядом</h2><small>${a.length} найдено</small></div>${min!==''&&max!==''&&+min>+max?'<p class="notice">Цена «от» больше цены «до». Измените диапазон.</p>':''}<div class="grid">${a.map(card).join('')||'<div class="empty">Ничего не найдено. Попробуйте изменить фильтры.</div>'}</div>`}

async function loadPhotos(input){const files=[...input.files];if(files.length+draftPhotos.length>10){toast('Можно добавить не больше 10 фото.');input.value='';return}photoBusy=true;$('#publish').disabled=true;try{const added=[];for(const f of files){if(!f.type.startsWith('image/'))throw Error('Выберите изображения.');if(f.size>25*1024*1024)throw Error('Фото слишком большое: максимум 25 МБ на исходный файл.');added.push(await compress(f))}draftPhotos.push(...added);previews();toast('Фото добавлены: '+draftPhotos.length+' из 10')}catch(e){toast(e.message||'Не удалось обработать фото. Попробуйте JPEG или PNG.')}finally{photoBusy=false;$('#publish').disabled=false;input.value=''}}
function compress(file){return new Promise((resolve,reject)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{try{const ratio=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*ratio));c.height=Math.max(1,Math.round(im.height*ratio));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))}catch(e){reject(e)}finally{URL.revokeObjectURL(u)}};im.onerror=()=>{URL.revokeObjectURL(u);reject(Error('Формат фото не поддерживается. Используйте JPEG, PNG или WebP.'))};im.src=u})}
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f);if(f.id==='adform'){if(photoBusy)return;const title=fd.get('title').trim(),desc=fd.get('desc').trim();if(!title||!desc){toast('Заполните название и описание.');return}const a={id:editing||uid(),title,desc,price:Number(fd.get('price')),cat:fd.get('cat'),city:fd.get('city'),contact:fd.get('contact').trim(),owner:'me',photos:[...draftPhotos],emoji:'📦'};if(!Number.isFinite(a.price)||a.price<0||a.photos.length>10)return;if(change(s=>{const i=s.ads.findIndex(x=>x.id===a.id);if(i>=0)s.ads[i]=a;else s.ads.unshift(a)})){editing=null;nav('profile');toast('Объявление сохранено на устройстве')}}else if(f.id==='profileform'){const name=fd.get('name').trim();if(!name){toast('Укажите имя или название.');return}if(change(s=>s.profile={name,type:fd.get('type'),city:fd.get('city'),bio:fd.get('bio').trim(),contact:fd.get('contact').trim()})){render();toast('Профиль сохранён')}}else if(f.id==='reviewform'){const text=fd.get('text').trim();if(!text)return;const owner=f.dataset.owner;if(change(s=>s.reviews.push({owner,name:s.profile.name,score:Number(fd.get('score')),text}))){sellerView(owner);toast('Демо-отзыв сохранён')}}else if(f.id==='chatform'){const text=fd.get('message').trim();if(!text)return;if(change(s=>s.chats[activeChat].push({by:'me',text},{by:'seller',text:'Автоответ демо: спасибо за сообщение! Для настоящего общения UNIK41 потребуется сервер.'}))){render();$('#messages').lastElementChild?.scrollIntoView({block:'nearest'})}}});

async function request(path,method='GET',body,extra={}){
 if(session?.expires_at&&session.expires_at*1000<Date.now()+60000&&!path.startsWith('/auth/'))await restoreSession();
 const headers={apikey:PUBLIC_KEY,...extra};if(session?.access_token&&!extra.Authorization)headers.Authorization='Bearer '+session.access_token;
 if(body!==undefined&&!(body instanceof Blob))headers['Content-Type']='application/json';
 const r=await fetch(API+path,{method,headers,body:body===undefined?undefined:body instanceof Blob?body:JSON.stringify(body)});
 const text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text}
 if(!r.ok)throw Error(data?.msg||data?.message||data?.error_description||data?.error||'Сервер временно недоступен');return data;

function messageTime(value){const d=new Date(value);return Number.isNaN(d.getTime())?'':d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function conversations(){const map=new Map();for(const m of cloudMessages){const peer=m.sender_id===session.user.id?m.recipient_id:m.sender_id;map.set(m.listing_id+':'+peer,{listing:m.listing_id,peer})}if(thread)map.set(thread.listing+':'+thread.peer,thread);return [...map.values()]}
chat=function(){if(!session)return authView();const conv=conversations();const a=state.ads.find(a=>a.id===thread?.listing),peer=thread?sellers[thread.peer]:null;return `<h2>Сообщения</h2><button id="refreshCloud">Обновить сообщения</button><p class="notice" id="messageSyncStatus">Новые сообщения проверяются автоматически каждые 5 секунд, пока сайт открыт. Переписка удаляется вместе с объявлением.</p><div class="chips">${conv.map(c=>`<button data-cloud-thread="${c.listing}:${c.peer}">${esc(sellers[c.peer]?.name||'Пользователь')} · ${esc(state.ads.find(a=>a.id===c.listing)?.title||'Объявление')}</button>`).join('')}</div>${a?`<div class="panel"><h3>${esc(a.title)}</h3><p>${esc(peer?.name||'Пользователь')}</p><div id="messages">${cloudMessages.filter(m=>m.listing_id===thread.listing&&[m.sender_id,m.recipient_id].includes(thread.peer)).map(m=>`<div class="message ${m.sender_id===session.user.id?'me':''}">${esc(m.body)}<small style="display:block;font-size:10px;text-align:right;margin-top:6px;color:#527082">${esc(messageTime(m.created_at))}</small></div>`).join('')||'<p>Начните разговор.</p>'}</div><form id="cloudchatform" class="search"><input name="message" required maxlength="1500" aria-label="Сообщение" placeholder="Ваше сообщение"><button class="primary">Отправить</button></form></div>`:'<p class="empty">Откройте объявление и нажмите «Написать».</p>'}`};
const originalDetail=detail,originalSellerView=sellerView;
detail=function(id){originalDetail(id);const m=$('#modal');m.innerHTML=m.innerHTML.replace('ДЕМОНСТРАЦИОННОЕ ОБЪЯВЛЕНИЕ','ОБЪЯВЛЕНИЕ').replace('Написать · демо','Написать')};
const detailWithCloud=detail;detail=function(id){detailWithCloud(id);const a=state.ads.find(a=>a.id===id);if(a&&a.owner!=='me')$('#modal').insertAdjacentHTML('beforeend',`<p><button class="danger" data-report="${id}">Пожаловаться на объявление</button></p>`)};
sellerView=function(id){originalSellerView(id);$('#modal').innerHTML=$('#modal').innerHTML.replace('Оставить демо-отзыв','Оставить отзыв').replace('Сохранить на устройстве','Опубликовать отзыв')};
async function task(fn){if(cloudBusy){toast('Дождитесь завершения операции');return}cloudBusy=true;const buttons=[...document.querySelectorAll('form button')];buttons.forEach(b=>b.disabled=true);try{await fn()}catch(e){toast('Не удалось выполнить: '+e.message)}finally{cloudBusy=false;buttons.forEach(b=>b.disabled=false)}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(b.id==='forgotPassword'){e.stopImmediatePropagation();openModal(`<h2>Восстановление пароля</h2><form id="recoverform" class="stack"><label>Почта вашего аккаунта<input name="email" type="email" required autocomplete="email" maxlength="254"></label><p class="notice">Отправим ссылку для задания нового пароля. Пока почтовый сервис UNIK41 не подключён, доставка писем ограничена тестовыми адресами.</p><button class="primary">Получить ссылку</button></form>`)}
 if(b.id==='cancelRecovery'){e.stopImmediatePropagation();recoveryToken=null;nav('profile')}
 if(d.report){e.stopImmediatePropagation();if(needLogin())return;openModal(`<h2>Жалоба на объявление</h2><form id="reportform" data-listing="${d.report}" class="stack"><label>Причина<select name="reason">${['Мошенничество','Запрещённый товар','Неверная категория','Спам','Другое'].map(r=>`<option>${r}</option>`).join('')}</select></label><label>Подробности<textarea name="description" maxlength="1000" placeholder="Расскажите, что не так"></textarea></label><p class="notice">Жалоба доступна только владельцу площадки в панели проверки. Одно обращение на объявление от аккаунта. Автоматического удаления и обещанного срока ответа пока нет.</p><button class="primary">Отправить жалобу</button></form>`)}
 if(d.fav){e.stopImmediatePropagation();if(needLogin())return;task(async()=>{if(state.favorites.includes(d.fav))await request('/rest/v1/favorites?user_id=eq.'+session.user.id+'&listing_id=eq.'+d.fav,'DELETE');else await request('/rest/v1/favorites','POST',{user_id:session.user.id,listing_id:d.fav});await refreshCloud();if($('#modal').open)detail(d.fav);else render()})}
 if(d.confirmDelete){e.stopImmediatePropagation();if(needLogin())return;task(async()=>{const a=state.ads.find(a=>a.id===d.confirmDelete);if(a?.owner!=='me')throw Error('Удалять можно только свои объявления');await request('/rest/v1/listings?id=eq.'+a.id,'DELETE');await refreshCloud();nav('profile');toast('Объявление удалено')})}
 if(d.delete){e.stopImmediatePropagation();openModal(`<h2>Удалить объявление?</h2><p>Оно исчезнет для всех пользователей вместе с перепиской. Фотографии останутся в хранилище до очистки владельцем проекта.</p><button class="danger" data-confirm-delete="${d.delete}">Удалить объявление</button>`)}
 if(d.cloudThread){e.stopImmediatePropagation();const [listing,peer]=d.cloudThread.split(':');thread={listing,peer};render()}
 if(b.id==='refreshCloud'){e.stopImmediatePropagation();task(async()=>{await refreshCloud();render();toast('Обновлено')})}
 if(b.id==='logout'){e.stopImmediatePropagation();task(async()=>{await request('/auth/v1/logout','POST');session=null;localStorage.removeItem('unik41-session');thread=null;await refreshCloud();nav('profile')})}
},true);
async function uploadPhotos(photos){const urls=[];for(const p of photos){if(p.startsWith(API+'/storage/v1/object/public/listing-photos/')){urls.push(p);continue}if(!p.startsWith('data:image/jpeg;base64,'))throw Error('Недопустимый формат фотографии');const blob=await (await fetch(p)).blob(),path=session.user.id+'/'+crypto.randomUUID()+'.jpg';await request('/storage/v1/object/listing-photos/'+path,'POST',blob,{'Content-Type':'image/jpeg'});urls.push(API+'/storage/v1/object/public/listing-photos/'+path)}return urls}
document.addEventListener('submit',e=>{const f=e.target;if(!['authform','adform','profileform','reviewform','cloudchatform','recoverform','resetpasswordform','reportform'].includes(f.id))return;e.preventDefault();e.stopImmediatePropagation();const fd=new FormData(f),action=e.submitter?.value;
 task(async()=>{
 if(f.id==='recoverform'){await request('/auth/v1/recover?redirect_to='+encodeURIComponent('https://unik41.github.io/unik41/'),'POST',{email:fd.get('email').trim()});openModal('<h2>Запрос принят</h2><p>Если почта зарегистрирована и отправка разрешена, придёт письмо со ссылкой. Проверьте «Спам». Для массовой регистрации ещё требуется подключение почтового сервиса.</p>');return}
 if(f.id==='resetpasswordform'){if(!recoveryToken)throw Error('Откройте новую ссылку восстановления');const password=fd.get('password');if(password.length<10)throw Error('Минимум 10 символов');if(password!==fd.get('repeat'))throw Error('Пароли не совпадают');const headers={Authorization:'Bearer '+recoveryToken};await request('/auth/v1/user','PUT',{password},headers);try{await request('/auth/v1/logout?scope=local','POST',undefined,headers)}catch{}recoveryToken=null;session=null;localStorage.removeItem('unik41-session');await refreshCloud();nav('profile');toast('Пароль изменён. Войдите с новым паролем.');return}
 if(f.id==='authform'){const email=fd.get('email').trim(),password=fd.get('password');if(action==='signup'){const name=fd.get('displayName').trim();if(!name)throw Error('Укажите имя для регистрации');await request('/auth/v1/signup?redirect_to='+encodeURIComponent('https://unik41.github.io/unik41/'),'POST',{email,password,data:{display_name:name}});toast('Проверьте почту и подтвердите регистрацию. Затем войдите.');f.reset();return}session=await request('/auth/v1/token?grant_type=password','POST',{email,password});localStorage.setItem('unik41-session',JSON.stringify(session));const existing=await request('/rest/v1/profiles?id=eq.'+session.user.id);if(!existing.length)await request('/rest/v1/profiles','POST',{id:session.user.id,name:session.user.user_metadata?.display_name||'Пользователь',city:cities[0]});await refreshCloud();nav('profile');toast('Вы вошли');return}
 if(needLogin())return;
 if(f.id==='reportform'){try{await request('/rest/v1/reports','POST',{reporter_id:session.user.id,listing_id:f.dataset.listing,reason:fd.get('reason'),description:fd.get('description').trim()})}catch(e){if(/duplicate|unique/i.test(e.message))throw Error('Вы уже отправили жалобу на это объявление');throw e}openModal('<h2>Жалоба сохранена</h2><p>Она доступна владельцу площадки для ручной проверки.</p>');return}
 if(f.id==='adform'){if(photoBusy)throw Error('Дождитесь обработки фото');const title=fd.get('title').trim(),description=fd.get('desc').trim();if(!title||!description)throw Error('Заполните название и описание');const photos=await uploadPhotos([...draftPhotos]);const body={owner_id:session.user.id,title,description,price:Number(fd.get('price')),category:fd.get('cat'),city:fd.get('city'),contact:fd.get('contact').trim(),photos};await request('/rest/v1/listings'+(editing?'?id=eq.'+editing:''),editing?'PATCH':'POST',body);editing=null;await refreshCloud();nav('profile');toast('Объявление опубликовано для всех')}
 if(f.id==='profileform'){const name=fd.get('name').trim();if(!name)throw Error('Укажите имя');await request('/rest/v1/profiles?id=eq.'+session.user.id,'PATCH',{name,type:fd.get('type'),city:fd.get('city'),bio:fd.get('bio').trim()});await refreshCloud();render();toast('Профиль сохранён')}
 if(f.id==='reviewform'){const body=fd.get('text').trim(),seller_id=cloudRatingOwner(f.dataset.owner);if(!body)throw Error('Введите отзыв');await request('/rest/v1/reviews?on_conflict=author_id,seller_id','POST',{author_id:session.user.id,seller_id,score:Number(fd.get('score')),body},{Prefer:'resolution=merge-duplicates'});await refreshCloud();sellerView(f.dataset.owner);toast('Отзыв опубликован')}
 if(f.id==='cloudchatform'){const body=fd.get('message').trim();if(!body)return;await request('/rest/v1/messages','POST',{listing_id:thread.listing,sender_id:session.user.id,recipient_id:thread.peer,body});await refreshCloud();render();$('#messages')?.lastElementChild?.scrollIntoView({block:'nearest'})}
 });
},true);
// Only conversation content is refreshed. Form drafts and photo selections stay intact.
let messagePolling=false,messageSyncFailed=false;
function messageReadMap(){try{return JSON.parse(localStorage.getItem('unik41-read-'+session.user.id))||{}}catch{return {}}}
function messageKey(m){return m.listing_id+':'+(m.sender_id===session.user.id?m.recipient_id:m.sender_id)}
function updateUnread(){
 if(!session){document.title='UNIK41 · Камчатка рядом';return}
 const read=messageReadMap();
 if(page==='chat'&&thread&&!document.hidden&&!$('#modal').open){const key=thread.listing+':'+thread.peer;for(const m of cloudMessages.filter(m=>messageKey(m)===key)){const stamp=Date.parse(m.created_at)||0;read[key]=Math.max(read[key]||0,stamp)}try{localStorage.setItem('unik41-read-'+session.user.id,JSON.stringify(read))}catch{}}
 const count=cloudMessages.filter(m=>m.recipient_id===session.user.id&&(Date.parse(m.created_at)||0)>(read[messageKey(m)]||0)).length;
 const btn=document.querySelector('.bottom [data-nav="chat"]');if(btn){btn.querySelector('.unread-badge')?.remove();btn.setAttribute('aria-label',count?'Сообщения: '+count+' непрочитанных':'Сообщения');if(count)btn.insertAdjacentHTML('beforeend',`<span class="unread-badge" style="display:inline-block;background:#c6394f;color:white;border-radius:20px;padding:2px 6px;font-weight:700;margin-left:4px" aria-live="polite">${count>99?'99+':count}</span>`)}
 document.title=(count?'('+count+') ':'')+'UNIK41 · Камчатка рядом';
}
const renderWithCloud=render;render=function(){renderWithCloud();updateUnread()};
async function syncMessages(){
 if(!session||!cloudReady||cloudBusy||messagePolling||document.hidden||!navigator.onLine)return;
 messagePolling=true;try{
 const oldIds=new Set(cloudMessages.map(m=>m.id));const fresh=await request('/rest/v1/messages?select=*&order=created_at.asc');
 const incoming=fresh.filter(m=>!oldIds.has(m.id)&&m.recipient_id===session.user.id);
 const changed=JSON.stringify(fresh)!==JSON.stringify(cloudMessages);cloudMessages=fresh;messageSyncFailed=false;
 if(changed&&page==='chat'&&!$('#modal').open){const input=$('#cloudchatform [name=message]'),draft=input?.value||'',focused=input===document.activeElement,start=input?.selectionStart,end=input?.selectionEnd;const y=window.scrollY;render();const next=$('#cloudchatform [name=message]');if(next){next.value=draft;if(focused){next.focus({preventScroll:true});next.setSelectionRange(start,end)}}window.scrollTo(0,y)}
 updateUnread();const outside=incoming.some(m=>page!=='chat'||!thread||messageKey(m)!==thread.listing+':'+thread.peer||$('#modal').open);if(outside)toast('Новое сообщение! Откройте раздел «Сообщения».');
 const status=$('#messageSyncStatus');if(status)status.textContent='Новые сообщения проверяются автоматически каждые 5 секунд, пока сайт открыт. Последняя проверка: '+new Date().toLocaleTimeString('ru-RU');
 }catch(e){messageSyncFailed=true;const status=$('#messageSyncStatus');if(status)status.textContent='Не удалось обновить сообщения. Проверьте интернет; повторим автоматически.'}finally{messagePolling=false}
}
setInterval(syncMessages,5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncMessages()});
window.addEventListener('online',syncMessages);
(async()=>{if(location.hash.includes('access_token=')||location.hash.includes('error=')){const params=new URLSearchParams(location.hash.slice(1));const error=params.get('error_description');if(params.get('type')==='recovery'&&params.get('access_token'))recoveryToken=params.get('access_token');history.replaceState(null,'',location.pathname);toast(error||(recoveryToken?'Задайте новый пароль.':'Почта подтверждена. Войдите в свой аккаунт.'));page='profile'}state.ads=[];state.reviews=[];state.favorites=[];state.chats={};render();await restoreSession();try{await refreshCloud();render()}catch(e){$('#app').innerHTML='<h2>Не удалось подключиться</h2><p class="notice">Проверьте интернет и повторите загрузку. Локальные демо-данные не публикуются автоматически.</p><button id="refreshCloud">Повторить подключение</button>';toast(e.message)}})();

</script></body></html>
